name: A股实时监控

on:
  workflow_dispatch:
  schedule:
    # 北京时间 09:30-11:30、13:00-15:00，每 30 分钟扫描一次
    - cron: "30 1 * * 1-5"
    - cron: "0,30 2-3 * * 1-5"
    - cron: "0,30 5-6 * * 1-5"
    - cron: "0 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: realtime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FEISHU_WEBHOOK: "${{ secrets.FEISHU_WEBHOOK }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: monitor_state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run realtime monitor
        run: python -u realtime_monitor.py --force

      - name: Save monitor state
        if: "${{ always() && hashFiles('monitor_state.json') != '' }}"
        uses: actions/cache/save@v4
        with:
          path: monitor_state.json
          key: monitor-state-${{ github.run_id }}
